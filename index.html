<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="register.css" />
    <style>
      input[type="text"] {
        width: 300px;
        height: 40px;
        font-size: 16px;
        padding: 10px;
      }
      input[type="tel"] {
        width: 300px;
        height: 40px;
        font-size: 16px;
        padding: 10px;
      }
      input[type="email"] {
        width: 300px;
        height: 40px;
        font-size: 16px;
        padding: 10px;
      }
      select {
        width: 300px;
        height: 40px;
        font-size: 16px;
        padding: 10px;
      }

      label {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="header" width="25%">
        <h2 id="header1">REGISTER NOW!</h2>
      </div>
      <div id="content">
        <form action="">
          <label for="name">Full Name</label>
          <input
            type="text"
            required
            name=""
            id="name"
            placeholder="Enter your name"
          />
          <br />
          <br />
          <label for="dept">Department</label>
          <select id="department" name="department">
            <option value="">-- Select Department --</option>
            <option value="">CSE</option>
            <option value="">ME</option>
            <option value="">ECE</option>
            <option value="">EEE</option>
            <option value="">CE</option>
          </select>
          <br />
          <br />
          <label for="mailid">Email_id</label>
          <input type="email" name="" id="mailid" required />
          <br />
          <br />
          <label for="">Phone number</label>
          <input type="tel" name="" id="phone" pattern="[0-9]{10}" required />
          <br />
          <br />
          <button type="submit" id="btn" margin-left="30px">Submit</button>
        </form>
      </div>
    </header>
  </body>
</html>
